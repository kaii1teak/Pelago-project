    circle { fill: #0a0a0a; }
    @media (prefers-color-scheme: dark) { circle { fill: #f0f0f0; } }
  </style>
  <circle cx="13" cy="18" r="10"/>
  <circle cx="25.5" cy="9" r="4.5"/>
  <circle cx="26" cy="24.5" r="2.5"/>
</svg>
